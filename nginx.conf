server {
    listen 80;

    # ─────────────────────────────────────────────
    # Spring Boot API — always proxied to the backend
    # ─────────────────────────────────────────────
    location ~ ^/(member|activity|product|areport|email|back-|seat|collect|blockmodel|placemodel|session|torder|porder|pcoupon|pcomment|follow|acomment) {
        proxy_pass         http://app:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket (seat selection real-time)
    location /ws {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }

    # ─────────────────────────────────────────────
    # ✅ ACTIVE: Vue 3 SPA (new frontend)
    # ─────────────────────────────────────────────
    location / {
        proxy_pass         http://vue-frontend:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────
    # 🔄 ROLLBACK: uncomment below and comment out the Vue block above,
    # then run: docker compose restart nginx
    # ─────────────────────────────────────────────
    # location / {
    #     proxy_pass         http://app:8080;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    # }
}
